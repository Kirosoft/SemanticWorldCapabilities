description: "Executable capability that validates a composed set of proposed changes against affected HG types, bindings, and active policy, then atomically materialises the lawful changes."
relationship_bindings:
  - handle: "semantic_telemetry"
    description: "Triggers external semantic telemetry only after the composed change set has been successfully materialised."
    relationship: "edge/triggers"
    target: "node/capability/executablecapability/semantictelemetry"
    cardinality:
      targets_per_source:
        min: 1
        max: null
      sources_per_target:
        min: 0
        max: null
guarantees:
  - "Cannot grant mutation authority to the capability that proposed a change."
  - "Applies a composed change set atomically or leaves HG instances unchanged."
groups:
  - "kernel"
domain: "platform"
