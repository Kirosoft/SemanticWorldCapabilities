description: "Projection of existing HG instances that exposes forward, backward, and single-step navigation morphisms over its admitted semantic context."
relationship_bindings:
  - handle: "collect_forward"
    description: "Exposes CollectForward(projection), which collects values by forward traversal of selected HG bindings retained in the projection."
    relationship: "edge/exposes"
    target: "node/capability/executablecapability/collectforward"
    cardinality:
      targets_per_source:
        min: 1
        max: null
      sources_per_target:
        min: 0
        max: null
  - handle: "collect_backwards"
    description: "Exposes CollectBackwards(projection), which collects values by backward traversal of selected HG bindings retained in the projection."
    relationship: "edge/exposes"
    target: "node/capability/executablecapability/collectbackwards"
    cardinality:
      targets_per_source:
        min: 1
        max: null
      sources_per_target:
        min: 0
        max: null
  - handle: "navigate"
    description: "Exposes Navigate(selection), which performs one navigation step through a selected HG binding and endpoint in projection context."
    relationship: "edge/exposes"
    target: "node/capability/executablecapability/navigate"
    cardinality:
      targets_per_source:
        min: 1
        max: null
      sources_per_target:
        min: 0
        max: null
guarantees:
  - "Projects existing HG instances without introducing another semantic world."
  - "Exposes forward, backward, and single-step navigation only through admitted executable capabilities and their projection context."
groups:
  - "kernel"
domain: "platform"
