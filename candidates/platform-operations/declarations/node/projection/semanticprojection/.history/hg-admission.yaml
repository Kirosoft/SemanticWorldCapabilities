declaration_path: "node/projection/semanticprojection"
disposition: "admitted"
distinction: "SemanticProjection denotes a Projection of HG instances that exposes the admitted navigation morphisms CollectForward(props), CollectBackwards(props), and Navigate(prop). A general Projection need not provide executable navigation, while SemanticProjection does not create a separate semantic world or duplicate the instances it projects."
generic_warrant: "Navigable, policy-governed views over existing HG instances recur wherever people or processes must traverse a bounded semantic context without replacing the authority, identity, or storage of those instances."
supports:
  - "relationship_binding:collect_forward"
  - "relationship_binding:collect_backwards"
  - "relationship_binding:navigate"
  - "guarantee:Projects existing HG instances without introducing another semantic world."
  - "guarantee:Exposes forward, backward, and single-step navigation only through admitted executable capabilities and their projection context."
