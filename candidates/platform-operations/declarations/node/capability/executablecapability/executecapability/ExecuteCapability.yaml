description: "Executable capability that invokes an admitted ExecutableCapability through its implementation binding, declared function contract, and applicable policy."
input_ports:
  - name: "invocation"
    role: "requirement"
    cardinality: {"min": 1, "max": 1}
    value:
      kind: "structured"
      members:
        - name: "capability"
          role: "selected"
          cardinality: {"min": 1, "max": 1}
          value:
            kind: "reference"
            target:
              kind: "declaration"
              type: "node/capability/executablecapability"
        - name: "interface_digest"
          role: "revision"
          cardinality: {"min": 1, "max": 1}
          constraints: {"min_length": 64, "max_length": 64, "pattern": "^[0-9a-f]{64}$"}
          value: {"kind": "text", "semantic_type": "property/identifier"}
        - name: "arguments"
          role: "input"
          cardinality: {"min": 1, "max": 1}
          value:
            kind: "capability_interface"
            selector: "capability"
            digest_selector: "interface_digest"
            facet: "input"
output_ports:
  - name: "result"
    role: "result"
    cardinality: {"min": 1, "max": 1}
    value:
      kind: "variant"
      members:
        - name: "success"
          role: "result"
          cardinality: {"min": 1, "max": 1}
          value:
            kind: "structured"
            members:
              - name: "output"
                role: "output"
                cardinality: {"min": 1, "max": 1}
                value:
                  kind: "capability_interface"
                  selector: "invocation.capability"
                  digest_selector: "invocation.interface_digest"
                  input_selector: "invocation.arguments"
                  facet: "output"
        - name: "failure"
          role: "result"
          cardinality: {"min": 1, "max": 1}
          value:
            kind: "capability_interface"
            selector: "invocation.capability"
            digest_selector: "invocation.interface_digest"
            input_selector: "invocation.arguments"
            facet: "failure"
failures:
  - name: "failure"
    role: "result"
    cardinality: {"min": 1, "max": 1}
    value:
      kind: "structured"
      members:
        - name: "kind"
          role: "classifier"
          cardinality: {"min": 1, "max": 1}
          constraints:
            allowed_values: ["binding_unavailable", "input_invalid", "interface_stale", "policy_rejected", "result_invalid"]
          value: {"kind": "text", "semantic_type": "property/classifier"}
        - name: "reason"
          role: "reason"
          cardinality: {"min": 1, "max": null}
          collection_semantics: "sequence"
          constraints: {"min_length": 1}
          value: {"kind": "text", "semantic_type": "property/descriptive"}
external_io: false
policies: []
guarantees:
  - "Invokes only an admitted executable capability whose inputs, outputs, policy, and implementation binding are satisfied."
  - "Returns the selected Capability's HG-typed outputs without a separate Effect channel."
  - "Does not confer mutation authority; materialisation remains subject to protected authorisation."
groups:
  - "kernel"
domain: "system"
