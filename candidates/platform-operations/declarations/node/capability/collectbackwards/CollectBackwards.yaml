description: "Capability implementing CollectBackwards(projection): collects values reachable by backward traversal of the selected HG bindings retained in the input projection and returns the resulting Projection."
input_ports:
  - name: "projection"
    role: "source"
    cardinality: {"min": 1, "max": 1}
    value:
      kind: "reference"
      target: {"kind": "instance", "type": "node/projection"}
output_ports:
  - name: "result"
    role: "result"
    cardinality: {"min": 1, "max": 1}
    value: {"kind": "subject", "semantic_type": "node/projection"}
failures: []
external_io: false
policies: []
guarantees:
  - "Collects only the selection retained in the input Projection, preserving HG binding, owner and traversal provenance."
  - "Returns only values reachable through admitted backward traversal in the projection context."
  - "Returns exactly one Projection as the collection result."
  - "Does not materialise or mutate HG instances merely by collecting."
groups:
  - "kernel"
domain: "platform"
