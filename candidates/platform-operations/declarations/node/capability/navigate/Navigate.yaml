description: "Capability performing one navigation step through a selected HG binding and endpoint in retained Projection context."
input_ports:
  - name: "projection"
    role: "source"
    cardinality: {"min": 1, "max": 1}
    value:
      kind: "reference"
      target: {"kind": "instance", "type": "node/projection"}
  - name: "selection"
    role: "selected"
    cardinality:
      min: 1
      max: 1
    value:
      kind: "variant"
      members:
        - name: "property"
          role: "selected"
          cardinality:
            min: 1
            max: 1
          value:
            kind: "structured"
            members:
              - name: "endpoint"
                role: "owner"
                cardinality:
                  min: 1
                  max: 1
                value:
                  kind: "reference"
                  target:
                    kind: "instance"
                    axes: ["node"]
              - name: "binding"
                role: "selected"
                cardinality:
                  min: 1
                  max: 1
                value:
                  kind: "reference"
                  target:
                    kind: "property_binding"
        - name: "relationship"
          role: "selected"
          cardinality:
            min: 1
            max: 1
          value:
            kind: "structured"
            members:
              - name: "endpoint"
                role: "source"
                cardinality:
                  min: 1
                  max: 1
                value:
                  kind: "reference"
                  target:
                    kind: "instance"
                    axes: ["node"]
              - name: "binding"
                role: "selected"
                cardinality:
                  min: 1
                  max: 1
                value:
                  kind: "reference"
                  target:
                    kind: "relationship_binding"
              - name: "direction"
                role: "traversal"
                cardinality:
                  min: 1
                  max: 1
                value:
                  kind: "text"
                  semantic_type: "property/classifier"
                constraints:
                  allowed_values: ["source_to_target", "target_to_source"]
output_ports:
  - name: "result"
    role: "result"
    cardinality: {"min": 1, "max": 1}
    value: {"kind": "subject", "semantic_type": "node/projection"}
failures: []
external_io: false
policies: []
guarantees:
  - "Accepts only a binding and endpoint currently navigable in the retained projection context."
  - "Preserves the selected HG binding, endpoint and relationship direction independently of loaded values."
  - "Returns exactly one Projection as the navigation result."
  - "Does not materialise or mutate HG instances merely by navigating."
groups:
  - "kernel"
domain: "platform"
